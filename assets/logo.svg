<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="maintenx-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="maintenx-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="maintenx-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="200" height="200" rx="44" fill="#0B0F19" />
  <rect x="2" y="2" width="196" height="196" rx="42" stroke="url(#maintenx-accent)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Tech Gear Ring -->
  <g stroke="url(#maintenx-blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <circle cx="100" cy="100" r="68" stroke-dasharray="14 10" />
    <circle cx="100" cy="100" r="54" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Glowing Precision Hexagon Core -->
  <polygon points="100,56 138,78 138,122 100,144 62,122 62,78" fill="#111827" stroke="url(#maintenx-purple)" stroke-width="3" filter="url(#glow)"/>

  <!-- Pulse Wave Line (Uptime / Health) -->
  <path d="M 66 100 L 86 100 L 93 84 L 102 118 L 109 94 L 115 104 L 134 100" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Industrial Wrench & Caliper Overlap Motif (Subtle Center Marker) -->
  <circle cx="100" cy="100" r="6" fill="#60A5FA" />
  <circle cx="100" cy="100" r="2.5" fill="#FFFFFF" />

  <!-- Corner Tech Accents -->
  <path d="M 28 44 L 28 28 L 44 28" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 172 44 L 172 28 L 156 28" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 156 L 28 172 L 44 172" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 172 156 L 172 172 L 156 172" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
</svg>
